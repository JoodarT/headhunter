databaseChangeLog:
  - changeSet:
      id: 20-add-password-reset-columns
      author: joodar
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: reset_password_token
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reset_password_token
                  type: varchar(255)
              - column:
                  name: reset_password_token_expiry
                  type: timestamp
