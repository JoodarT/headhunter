databaseChangeLog:
  - changeSet:
      id: 2026-08-13-add-email-to-resumes
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: resumes
                columnName: email
      changes:
        - addColumn:
            tableName: resumes
            columns:
              - column:
                  name: email
                  type: VARCHAR(255)

  - changeSet:
