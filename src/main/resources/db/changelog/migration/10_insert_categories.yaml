        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Data Science / ML" }
        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Базы данных (DBA)" }
        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Системное администрирование" }
        - insert:
            tableName: categories
            columns:
              - column: { name: name, value: "Информационная безопасность" }
        - insert:
            tableName: categories
            columns:
